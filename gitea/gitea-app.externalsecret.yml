apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitea-app
  namespace: gitea
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: gitea-app
    creationPolicy: Owner
  data:
    # username/password: read by the chart as gitea.admin.existingSecret
    - secretKey: username
      remoteRef:
        key: gitea/helm
        property: admin_username
    - secretKey: password
      remoteRef:
        key: gitea/helm
        property: admin_password
    # injected as GITEA__DATABASE__PASSWD via gitea.additionalConfigFromEnvs
    - secretKey: db_password
      remoteRef:
        key: gitea/helm
        property: db_password
