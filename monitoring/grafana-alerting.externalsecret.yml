apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-alerting
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-alerting
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          grafana_alert: "1"
      data:
        contactpoints.yaml: |
          apiVersion: 1
          contactPoints:
            - orgId: 1
              name: ssl-cert-slack
              receivers:
                - uid: ssl_cert_slack_1
                  type: slack
                  settings:
                    url: "{{ .webhook_url }}"
                    title: "SSL Certificate Expiring"
        policies.yaml: |
          apiVersion: 1
          policies:
            - orgId: 1
              receiver: ssl-cert-slack
              group_by: ["alertname", "instance"]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
  data:
    - secretKey: webhook_url
      remoteRef:
        key: grafana/alerts
        property: webhook_url
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
