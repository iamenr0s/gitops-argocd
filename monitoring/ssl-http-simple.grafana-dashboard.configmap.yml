apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-http-simple-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ssl-http-simple.json: |
    {
      "title": "SSL Certificate & HTTP Monitoring (Simple)",
      "uid": "ssl-http-simple",
      "description": "Simple SSL certificate and HTTP monitoring dashboard with direct data queries",
      "tags": ["ssl", "tls", "certificates", "http", "influxdb2", "telegraf"],
      "timezone": "browser",
      "schemaVersion": 42,
      "version": 1,
      "editable": true,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "weekStart": "",
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Certificates Monitored",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> count()"
            }
          ]
        },
        {
          "id": 2,
          "title": "Minimum Days Remaining",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> min()"
            }
          ]
        },
        {
          "id": 3,
          "title": "Verification Status",
          "type": "stat",
          "datasource": "influxdb",
          "description": "0 = verified OK",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "color": "green", "text": "OK" } } }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"verification_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> max()"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Endpoints Down",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"result_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> filter(fn: (r) => r._value != 0)\n  |> count()"
            }
          ]
        },
        {
          "id": 5,
          "title": "Certificate Details",
          "type": "table",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "color-background" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red" },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Days Remaining" }, "properties": [{ "id": "unit", "value": "d" }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and (r._field == \"expiry\" or r._field == \"verification_code\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> pivot(rowKey: [\"source\", \"common_name\", \"issuer_common_name\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with expiry: float(v: r.expiry) / 86400.0 }))\n  |> keep(columns: [\"source\", \"common_name\", \"issuer_common_name\", \"expiry\", \"verification_code\"])\n  |> rename(columns: {source: \"Target\", common_name: \"Common Name\", issuer_common_name: \"Issuer\", expiry: \"Days Remaining\", verification_code: \"Verify Code\"})\n  |> sort(columns: [\"Days Remaining\"])"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP Response Details",
          "type": "table",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "color-background" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Response Time (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] } }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and (r._field == \"response_time\" or r._field == \"http_response_code\" or r._field == \"result_code\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> pivot(rowKey: [\"server\", \"method\", \"result\", \"status_code\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> keep(columns: [\"server\", \"method\", \"result\", \"status_code\", \"http_response_code\", \"response_time\", \"result_code\"])\n  |> rename(columns: {server: \"Target\", method: \"Method\", result: \"Result\", status_code: \"Status Code\", http_response_code: \"HTTP Code\", response_time: \"Response Time (s)\", result_code: \"Result Code\"})\n  |> sort(columns: [\"Target\"])"
            }
          ]
        },
        {
          "id": 7,
          "title": "Days Until Expiry (Trend)",
          "type": "timeseries",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 26 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "yellow", "value": 14 },
                  { "color": "red", "value": 7 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))"
            }
          ]
        }
      ]
    }
