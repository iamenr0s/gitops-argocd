# Loki via grafana-community/helm-charts (chart 20.x). Only overrides of chart defaults live here;
# see `helm show values grafana-community/loki --version <ver>` for the rest.
deploymentMode: Monolithic
namespaceOverride: logging

global:
  # S3_* / AWS_* come from the loki-s3 ExternalSecret (see loki-s3.externalsecret.yml)
  extraEnvFrom:
    - secretRef:
        name: loki-s3

loki:
  image:
    tag: latest
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 240h
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    retention_enabled: true
  storage:
    type: s3
    bucketNames:
      chunks: ${S3_BUCKET}
      ruler: ${S3_BUCKET}
      admin: ${S3_BUCKET}
    s3:
      endpoint: ${S3_ENDPOINT}
      region: ${AWS_REGION}
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      s3ForcePathStyle: true
    object_store:
      s3:
        endpoint: ${S3_ENDPOINT}
        region: ${AWS_REGION}
        access_key_id: ${AWS_ACCESS_KEY_ID}
        secret_access_key: ${AWS_SECRET_ACCESS_KEY}

singleBinary:
  replicas: 1
  extraArgs:
    - -config.expand-env=true
  extraEnvFrom:
    - secretRef:
        name: loki-s3
  persistence:
    storageClass: kadalu.kadalu-pool-replica3
    enableStatefulSetAutoDeletePVC: true

# Monolithic mode: no memcached, no gateway (promtail pushes to logging-loki:3100)
chunksCache:
  enabled: false
resultsCache:
  enabled: false
gateway:
  enabled: false
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
