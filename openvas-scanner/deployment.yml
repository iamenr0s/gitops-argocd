apiVersion: apps/v1
kind: Deployment
metadata:
  name: openvasd
  namespace: openvas-scanner
  labels:
    app: openvasd
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openvasd
  template:
    metadata:
      labels:
        app: openvasd
    spec:
      # Feed content is refreshed on every pod (re)start by re-running these
      # feed images; there is no in-cluster mechanism to update feeds on a
      # running pod, see README "Updating feeds".
      initContainers:
        - name: vt-feed
          image: registry.community.greenbone.net/community/vulnerability-tests:latest
          volumeMounts:
            - name: vt-data
              mountPath: /mnt
        - name: notus-feed
          image: registry.community.greenbone.net/community/notus-data:latest
          volumeMounts:
            - name: notus-data
              mountPath: /mnt
        - name: gpg-feed
          image: registry.community.greenbone.net/community/gpg-data:latest
          volumeMounts:
            - name: gpg-data
              mountPath: /mnt
        - name: configure-openvas-log
          image: iamenr0s/openvas-scanner:latest
          env:
            # ERROR=4 CRITICAL=8 WARNING=16 MESSAGE=32 INFO=64 DEBUG=128
            - name: OPENVAS_LOG_LEVEL
              value: "64"
          command:
            - /bin/sh
            - -c
            - |
              sed "s/127/$OPENVAS_LOG_LEVEL/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
              chmod 644 /mnt/openvas_log.conf
              touch /var/log/openvas/openvas.log
              chmod 666 /var/log/openvas/openvas.log
          volumeMounts:
            - name: openvas-config
              mountPath: /mnt
            - name: openvas-log
              mountPath: /var/log/openvas
        - name: configure-openvas
          image: iamenr0s/openvas-scanner:latest
          env:
            - name: OPENVASD_PROTOCOL
              value: http
            - name: OPENVASD_PORT
              value: "3000"
          command:
            - /bin/sh
            - -c
            - |
              printf "table_driven_lsc = yes\nopenvasd_server = $OPENVASD_PROTOCOL://localhost:$OPENVASD_PORT\n" > /mnt/openvas.conf
              chmod 644 /mnt/openvas.conf
          volumeMounts:
            - name: openvas-config
              mountPath: /mnt
      containers:
        # Upstream's ghcr.io/greenbone/redis-server has no arm64 build (see
        # README "Architecture notes"). Vanilla redis:7-alpine, configured to
        # match what that image provides (unix socket only, no persistence,
        # extra logical DBs for concurrent scan KBs), is a drop-in substitute.
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --unixsocket
            - /run/redis/redis.sock
            - --unixsocketperm
            - "777"
            - --port
            - "0"
            - --save
            - ""
            - --appendonly
            - "no"
            - --databases
            - "128"
          volumeMounts:
            - name: redis-socket
              mountPath: /run/redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: openvasd
          image: iamenr0s/openvas-scanner:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: SCANNER_TYPE
              value: openvas
            - name: GNUPGHOME
              value: /etc/openvas/gnupg
            - name: XDG_CACHE_HOME
              value: /var/cache/
            - name: STORAGE_TYPE
              value: fs
            - name: STORAGE_PATH
              value: /var/lib/openvasd/storage
            - name: LISTENING
              value: 0.0.0.0:3000
            - name: OPENVASD_LOG
              value: INFO
            - name: REDIS_URL
              value: unix:///run/redis/redis.sock
            - name: STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: openvas-scanner-app
                  key: STORAGE_KEY
          volumeMounts:
            - name: openvas-config
              mountPath: /etc/openvas
            - name: openvas-log
              mountPath: /var/log/openvas
            - name: gpg-data
              mountPath: /etc/openvas/gnupg
            - name: notus-data
              mountPath: /var/lib/notus
            - name: vt-data
              mountPath: /var/lib/openvas/plugins
            - name: redis-socket
              mountPath: /run/redis
            - name: cache
              mountPath: /var/cache
            - name: openvasd-storage
              mountPath: /var/lib/openvasd/storage
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health/alive
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2000m
              memory: 4Gi
      volumes:
        - name: vt-data
          persistentVolumeClaim:
            claimName: openvas-vt-data
        - name: notus-data
          persistentVolumeClaim:
            claimName: openvas-notus-data
        - name: gpg-data
          persistentVolumeClaim:
            claimName: openvas-gpg-data
        - name: openvas-config
          persistentVolumeClaim:
            claimName: openvas-config
        - name: openvas-log
          persistentVolumeClaim:
            claimName: openvas-log
        - name: openvasd-storage
          persistentVolumeClaim:
            claimName: openvasd-storage
        - name: redis-socket
          emptyDir: {}
        - name: cache
          emptyDir: {}
