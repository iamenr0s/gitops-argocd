---
nameOverride: ""
fullnameOverride: ""
kubeVersionOverride: ""

global:
  security:
    allowInsecureImages: true
  nameOverride: ""
  fullnameOverride: ""
  namespaceOverride: ""
  additionalLabels: {}
  revisionHistoryLimit: 3
  image:
    repository: ghcr.io/goauthentik/server
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  deploymentAnnotations: {}
  podAnnotations: {}
  secretAnnotations: {}
  podLabels: {}
  addPrometheusAnnotations: false
  securityContext: {}
    # runAsUser: 1000
    # runAsGroup: 1000
    # fsGroup: 1000
  hostAliases: []
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity:
    podAntiAffinity: soft
    nodeAffinity:
      type: hard
      matchExpressions: []
  topologySpreadConstraints: []
  deploymentStrategy: {}
  env:
    # Non-secret connection info for the shared external Postgres and the
    # shared cluster Redis. AUTHENTIK_SECRET_KEY and
    # AUTHENTIK_POSTGRESQL__PASSWORD come from the authentik-app Secret
    # (see existingSecret below) instead of living here.
    - name: AUTHENTIK_POSTGRESQL__HOST
      value: postgresql.postgresql.svc.cluster.local
    - name: AUTHENTIK_POSTGRESQL__PORT
      value: "5432"
    - name: AUTHENTIK_POSTGRESQL__NAME
      value: authentik
    - name: AUTHENTIK_POSTGRESQL__USER
      value: authentik
    - name: AUTHENTIK_REDIS__HOST
      value: redis.databases.svc.cluster.local
    - name: AUTHENTIK_REDIS__PORT
      value: "6379"
  envFrom: []
  volumeMounts:
    - name: media
      mountPath: /media
  volumes:
    - name: media
      persistentVolumeClaim:
        claimName: authentik-media

authentik:
  enabled: true
  log_level: info
  secret_key: ""
  # existingSecret takes over entirely for AUTHENTIK_* secret injection: the
  # settings below (postgresql.password, secret_key, etc.) are only used to
  # render the chart's own Secret, which is skipped once secretName is set.
  # The authentik-app ExternalSecret supplies AUTHENTIK_SECRET_KEY and
  # AUTHENTIK_POSTGRESQL__PASSWORD instead.
  existingSecret:
    secretName: authentik-app
  events:
    context_processors:
      geoip: /geoip/GeoLite2-City.mmdb
      asn: /geoip/GeoLite2-ASN.mmdb
  web:
    path: /
  email:
    host: ""
    port: 587
    username: ""
    password: ""
    use_tls: false
    use_ssl: false
    timeout: 30
    from: ""
  outposts:
    # -- Template used for managed outposts. The following placeholders can be used
    # %(type)s - the type of the outpost
    # %(version)s - version of your authentik install
    # %(build_hash)s - only for beta versions, the build hash of the image
    container_image_base: ghcr.io/goauthentik/%(type)s:%(version)s
  error_reporting:
    # -- This sends anonymous usage-data, stack traces on errors and
    # performance data to sentry.beryju.org, and is fully opt-in
    enabled: false
    # -- This is a string that is sent to sentry with your error reports
    environment: "k8s"
    # -- Send PII (Personally identifiable information) data to sentry
    send_pii: false
  postgresql:
    # -- set the postgresql hostname to talk to
    # if unset and .Values.postgresql.enabled == true, will generate the default
    # @default -- `{{ .Release.Name }}-postgresql`
    host: "{{ .Release.Name }}-postgresql"
    # -- postgresql Database name
    # @default -- `authentik`
    name: "authentik"
    # -- postgresql Username
    # @default -- `authentik`
    user: "authentik"
    # -- postgresql password
    password: ""
    # -- postgresql port
    port: 5432

blueprints:
  configMaps: []
  secrets: []

server:
  enabled: true
  name: server
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: ~
    behavior: {}
    metrics: []
  pdb:
    enabled: false
    labels: {}
    annotations: {}
    minAvailable: ""
    maxUnavailable: ""
  image:
    repository: "" # defaults to global.image.repository
    tag: "" # defaults to global.image.tag
    digest: "" # defaults to global.image.digest
    pullPolicy: "" # defaults to global.image.pullPolicy
  imagePullSecrets: []
  env: []
  envFrom: []
  lifecycle: {}
  extraContainers: []
  initContainers: []
  volumeMounts: []
  volumes: []
  deploymentAnnotations: {}
  podAnnotations: {}
  podLabels: {}
  # Best-effort QoS (no requests) let this pod get starved of CPU under node
  # contention, which made every health check exceed the 3s probe timeout
  # even though the app itself was up and answering (slow-query log showed
  # trivial SELECTs taking 2-3s) — kubelet kept killing it as a false
  # positive. Requests fix scheduling priority; timeouts below give it room.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
  containerPorts:
    http: 9000
    https: 9443
    metrics: 9300
  hostNetwork: false
  dnsConfig: {}
  dnsPolicy: ""
  serviceAccountName: ~
  automountServiceAccountToken: ~
  securityContext: {}
  containerSecurityContext: {}
  livenessProbe:
    failureThreshold: 6
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 8
    httpGet:
      path: "{{ .Values.authentik.web.path }}-/health/live/"
      port: http
  readinessProbe:
    failureThreshold: 6
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 8
    httpGet:
      path: "{{ .Values.authentik.web.path }}-/health/ready/"
      port: http
  startupProbe:
    # Same story as liveness/readiness above: this endpoint's own DB query
    # was repeatedly logged at 2-3s ("slow statement" warnings) even during
    # otherwise-healthy operation, well over the previous 3s timeout — so
    # nearly every check was a coin flip. 10s gives real headroom.
    failureThreshold: 60
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
    httpGet:
      path: "{{ .Values.authentik.web.path }}-/health/live/"
      port: http
  terminationGracePeriodSeconds: 30
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  deploymentStrategy: {}
  service:
    annotations: {}
    labels: {}
    type: ClusterIP
    nodePortHttp: 30080
    nodePortHttps: 30443
    servicePortHttp: 80
    servicePortHttps: 443
    servicePortHttpName: http
    servicePortHttpsName: https
    # servicePortHttpAppProtocol: HTTP
    # servicePortHttpsAppProtocol: HTTPS
    loadBalancerIP: ""
    loadBalancerSourceRanges: []
    externalIPs: []
    externalTrafficPolicy: ""
    sessionAffinity: ""
    sessionAffinityConfig: {}
  metrics:
    enabled: false
    service:
      type: ClusterIP
      clusterIP: ""
      annotations: {}
      labels: {}
      servicePort: 9300
      portName: metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 3s
      relabelings: []
      metricRelabelings: []
      selector: {}
      scheme: ""
      tlsConfig: {}
      namespace: ""
      labels: {}
      annotations: {}
  ingress:
    enabled: true
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
      cert-manager.io/cluster-issuer: letsencrypt-production
      kubernetes.io/tls-acme: "true"
    labels: {}
    ingressClassName: traefik
    hosts:
      - authentik.apps.k8s.enros.me
    paths:
      - "{{ .Values.authentik.web.path }}"
    pathType: Prefix
    extraPaths: []
    tls:
      - hosts:
          - authentik.apps.k8s.enros.me
        secretName: authentik-tls
    https: false
  route:
    main:
      enabled: false
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      annotations: {}
      labels: {}
      hostnames: []
      parentRefs: []
      httpsRedirect: false
      https: false
      matches:
        - path:
            type: PathPrefix
            value: "{{ .Values.authentik.web.path }}"
      filters: []
      additionalRules: []

worker:
  enabled: true
  name: worker
  replicas: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 50
    targetMemoryUtilizationPercentage: ~
    behavior: {}
    metrics: []
  pdb:
    enabled: false
    labels: {}
    annotations: {}
    minAvailable: ""
    maxUnavailable: ""
  image:
    repository: "" # defaults to global.image.repository
    tag: "" # defaults to global.image.tag
    digest: "" # defaults to global.image.digest
    pullPolicy: "" # defaults to global.image.pullPolicy
  imagePullSecrets: []
  env: []
  envFrom: []
  lifecycle: {}
  extraContainers: []
  initContainers: []
  volumeMounts: []
  volumes: []
  deploymentAnnotations: {}
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi
  containerPorts:
    http: 9000
    metrics: 9300
  hostNetwork: false
  dnsConfig: {}
  dnsPolicy: ""
  serviceAccountName: ~
  automountServiceAccountToken: ~
  securityContext: {}
  containerSecurityContext: {}
  livenessProbe:
    failureThreshold: 6
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 8
    exec:
      command:
        - ak
        - healthcheck
  readinessProbe:
    failureThreshold: 6
    initialDelaySeconds: 5
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 8
    exec:
      command:
        - ak
        - healthcheck
  startupProbe:
    failureThreshold: 60
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 10
    exec:
      command:
        - ak
        - healthcheck
  terminationGracePeriodSeconds: 30
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  deploymentStrategy: {}
  metrics:
    enabled: false
    service:
      type: ClusterIP
      clusterIP: ""
      annotations: {}
      labels: {}
      servicePort: 9300
      portName: metrics
    serviceMonitor:
      enabled: false
      interval: 30s
      scrapeTimeout: 3s
      relabelings: []
      metricRelabelings: []
      selector: {}
      scheme: ""
      tlsConfig: {}
      namespace: ""
      labels: {}
      annotations: {}
serviceAccount:
  create: true
  annotations: {}
  # Left unset (not blanked to null) so the authentik-remote-cluster
  # subchart's own default (serviceAccountSecret.enabled: true) applies —
  # an explicit blank here nulls out that subchart's values entirely and
  # crashes templates/serviceaccount-secret.yaml on `.enabled`.
  fullnameOverride: authentik
geoip:
  enabled: false
  editionIds: "GeoLite2-City GeoLite2-ASN"
  updateInterval: 8
  accountId: ""
  licenseKey: ""
  existingSecret:
    secretName: ""
    accountId: "account_id"
    licenseKey: "license_key"
  image:
    repository: ghcr.io/maxmind/geoipupdate
    tag: v7.1.1
    digest: ""
    pullPolicy: IfNotPresent
  env: []
  envFrom: []
  volumeMounts: []
  resources: {}
  containerSecurityContext: {}
prometheus:
  rules:
    enabled: false
    namespace: ""
    selector: {}
    labels: {}
    annotations: {}
    additionalRuleGroupAnnotations: {}
postgresql:
  enabled: false
  image:
    registry: docker.io
    repository: library/postgres
    tag: "17.11-bookworm"
  auth:
    username: authentik
    database: authentik
    # password: ""
  primary:
    args:
      - -c
      - config_file=/bitnami/postgresql/conf/postgresql.conf
      - -c
      - hba_file=/bitnami/postgresql/conf/pg_hba.conf
    configuration: |
      listen_addresses = '*'
      port = '5432'
      wal_level = 'replica'
      fsync = 'on'
      hot_standby = 'on'
      log_connections = 'false'
      log_disconnections = 'false'
      log_hostname = 'false'
      client_min_messages = 'error'
      include_dir = 'conf.d'
    pgHbaConfiguration: |
      host     all             all             0.0.0.0/0               scram-sha-256
      host     all             all             ::/0                    scram-sha-256
      local    all             all                                     scram-sha-256
      host     all             all        127.0.0.1/32                 scram-sha-256
      host     all             all        ::1/128                      scram-sha-256
    extendedConfiguration: |
      max_connections = 500
    extraEnvVars:
      - name: POSTGRES_DB
        value: '{{ (include "postgresql.v1.database" .) }}'
    resourcesPreset: "none"
    # persistence:
    #   enabled: true
    #   storageClass:
    #   accessModes:
    #     - ReadWriteOnce
    containerSecurityContext:
      readOnlyRootFilesystem: true
    extraVolumeMounts:
      - name: postgresql-socket
        mountPath: /var/run/postgresql
    extraVolumes:
      - name: postgresql-socket
        emptyDir: {}
  readReplicas:
    resourcesPreset: "none"
  backup:
    resourcesPreset: "none"
  passwordUpdateJob:
    resourcesPreset: "none"
  volumePermissions:
    resourcesPreset: "none"
    image:
      repository: debian
      tag: 13-slim
  metrics:
    resourcesPreset: "none"
    image:
      repository: prometheuscommunity/postgres-exporter
      tag: v0.19.1
additionalObjects: []
