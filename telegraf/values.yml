replicaCount: 3
image:
  repository: quay.io/influxdb/telegraf-operator
  pullPolicy: IfNotPresent
  sidecarImage: "docker.io/library/telegraf:1.22"

classes:
  secretName: "telegraf-operator-classes"
  default: "infra"
  # infra must be explicitly nulled, not just omitted or set to {}:
  # Helm deep-merges this values file with the chart's own defaults
  # without deleting unset keys, so anything short of `infra: null`
  # falls through to the chart's built-in example config (legacy v1
  # outputs.influxdb, no token) and the Helm source keeps
  # re-overwriting the ExternalSecret-managed secret on every sync.
  # telegraf-classes.externalsecret.yml provides the real secret
  # instead, keeping the InfluxDB token in Vault.
  data:
    infra: null

certManager:
  enable: true

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  # Annotations to add to the service account
  annotations: {}
podSecurityContext: {}
  # fsGroup: 2000
securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000
resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 64Mi
sidecarResources:
  limits:
    cpu: 200m
    memory: 200Mi
  requests:
    cpu: 10m
    memory: 10Mi
nodeSelector: {}
tolerations: []
affinity: {}
requireAnnotationsForSecret: false
enableDefaultInternalPlugin: true
# allow hot reload ; disabled by default to support versions of telegraf
# that do not support hot-reload and --watch-config flag
hotReload: false

