apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-hardening-network-policies
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamenr0s/k8s-hardening-cis.git
    targetRevision: master
    path: 05-network-policies
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
    # automated intentionally omitted -> Application starts/stays OutOfSync (ARGO-04)
