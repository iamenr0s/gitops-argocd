apiVersion: apps/v1
kind: Deployment
metadata:
  name: x509-cert-check
  namespace: telegraf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: x509-cert-check
  template:
    metadata:
      labels:
        app: x509-cert-check
      annotations:
        # No app container needed here: this pod only exists to host the
        # telegraf-operator sidecar below, which does the actual SSL cert
        # checking. `pause` never talks to any of the monitored URLs.
        #
        # The URL list can't be injected via telegraf.influxdata.com/inputs
        # + an env-secretkeyref var: the operator validates the merged TOML
        # as plain text *before* telegraf's own $VAR substitution runs, so
        # an unquoted array placeholder like `sources = [$CERT_URLS]` fails
        # that static parse and the operator silently skips sidecar
        # injection. Using a dedicated class instead means ExternalSecret's
        # Go templating resolves the URLs server-side, so the rendered
        # class is already valid TOML with no runtime substitution needed.
        telegraf.influxdata.com/class: "x509-cert-check"
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            limits:
              cpu: 10m
              memory: 16Mi
            requests:
              cpu: 5m
              memory: 8Mi
