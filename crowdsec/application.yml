apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://crowdsecurity.github.io/helm-charts
      chart: crowdsec
      targetRevision: 0.24.0
      helm:
        valueFiles:
          - $values/crowdsec/values.yml
    - repoURL: https://github.com/iamenr0s/gitops-argocd.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/iamenr0s/gitops-argocd.git
      path: crowdsec
      targetRevision: main
      kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  ignoreDifferences:
    # CrowdSec generates random lapi secrets on each Helm render; ignore them to
    # prevent perpetual OutOfSync on the secret and its deployment checksum.
    - kind: Secret
      name: crowdsec-lapi-secrets
      namespace: crowdsec
      jsonPointers:
        - /data
    - group: apps
      kind: Deployment
      name: crowdsec-lapi
      namespace: crowdsec
      jqPathExpressions:
        - .spec.template.metadata.annotations["checksum/lapi-secret"]
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - RespectIgnoreDifferences=true
