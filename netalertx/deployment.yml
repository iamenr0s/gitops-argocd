apiVersion: apps/v1
kind: Deployment
metadata:
  name: netalertx
  namespace: netalertx
  labels:
    app: netalertx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netalertx
  template:
    metadata:
      labels:
        app: netalertx
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: netalertx
          image: ghcr.io/netalertx/netalertx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 20211
              name: http
            - containerPort: 20214
              name: graphql
          envFrom:
            - secretRef:
                name: netalertx-app
                optional: true
          env:
            - name: PUID
              value: "20211"
            - name: PGID
              value: "20211"
            - name: LISTEN_ADDR
              value: "0.0.0.0"
            - name: PORT
              value: "20211"
            - name: GRAPHQL_PORT
              value: "20214"
            - name: ALWAYS_FRESH_INSTALL
              value: "false"
            - name: NETALERTX_DEBUG
              value: "0"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - SETUID
                - SETGID
                - NET_ADMIN
                - NET_RAW
                - NET_BIND_SERVICE
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: netalertx-data
        - name: tmp
          emptyDir:
            medium: Memory
