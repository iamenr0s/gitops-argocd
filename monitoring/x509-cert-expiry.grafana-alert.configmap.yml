apiVersion: v1
kind: ConfigMap
metadata:
  name: x509-cert-expiry-alert
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  rules.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: ssl_cert_expiry
        folder: SSL Certificates
        interval: 5m
        rules:
          - uid: ssl_cert_expiry_days
            title: SSL Certificate Expiring Soon
            condition: B
            for: 5m
            noDataState: NoData
            execErrState: Alerting
            annotations:
              summary: "{{ $labels.instance }} certificate expires in under 14 days"
            labels:
              severity: warning
            data:
              - refId: A
                datasourceUid: influxdb
                queryType: ""
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  refId: A
                  query: |
                    from(bucket: "default")
                      |> range(start: -10m)
                      |> filter(fn: (r) => r._measurement == "x509_cert" and r._field == "expiry")
                      |> filter(fn: (r) => r.telegraf_class == "x509-cert-check")
                      |> last()
                      |> map(fn: (r) => ({ r with _value: float(v: int(v: float(v: r._value) / 86400.0)) }))
                      |> rename(columns: {source: "instance"})
                      |> keep(columns: ["instance", "_time", "_value"])
              - refId: B
                datasourceUid: "__expr__"
                queryType: ""
                relativeTimeRange:
                  from: 600
                  to: 0
                model:
                  refId: B
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: lt
                        params: [14]
