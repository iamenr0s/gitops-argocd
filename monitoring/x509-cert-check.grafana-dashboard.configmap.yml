apiVersion: v1
kind: ConfigMap
metadata:
  name: x509-cert-check-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  x509-cert-check.json: |
    {
      "title": "SSL Certificate Expiration (InfluxDB2)",
      "uid": "advblkr",
      "description": "Tracks TLS certificate expiry via Telegraf's x509_cert input, written to InfluxDB2 and queried with Flux.",
      "tags": ["ssl", "tls", "certificates", "security", "influxdb2", "telegraf"],
      "timezone": "browser",
      "schemaVersion": 42,
      "version": 1,
      "editable": true,
      "graphTooltip": 0,
      "refresh": "5m",
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "weekStart": "",
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "influxdb",
            "regex": "/^InfluxDB$/",
            "current": { "value": "influxdb", "text": "InfluxDB" },
            "options": []
          },
          {
            "name": "bucket",
            "type": "textbox",
            "query": "default",
            "current": { "value": "default" }
          },
          {
            "name": "source",
            "type": "query",
            "datasource": "${datasource}",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "options": [],
            "query": "import \"influxdata/influxdb/v1\"\nv1.tagValues(bucket: \"${bucket}\", tag: \"source\", predicate: (r) => r._measurement == \"x509_cert\")"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Expiring Within 14 Days",
          "type": "stat",
          "datasource": "${datasource}",
          "gridPos": { "h": 6, "w": 6, "x": 0, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with _value: r._value / 86400.0 }))\n  |> filter(fn: (r) => r._value < 14.0)\n  |> count()\n  |> yield(name: \"count\")"
            }
          ]
        },
        {
          "id": 2,
          "title": "Minimum Days Remaining",
          "type": "stat",
          "datasource": "${datasource}",
          "gridPos": { "h": 6, "w": 6, "x": 6, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with _value: r._value / 86400.0 }))\n  |> min()"
            }
          ]
        },
        {
          "id": 3,
          "title": "Certificates Monitored",
          "type": "stat",
          "datasource": "${datasource}",
          "gridPos": { "h": 6, "w": 6, "x": 12, "y": 0 },
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> last()\n  |> count()"
            }
          ]
        },
        {
          "id": 4,
          "title": "Verification Status",
          "type": "stat",
          "datasource": "${datasource}",
          "description": "0 = verified OK. Nonzero means at least one certificate is failing chain/hostname verification (x509_cert's verification_code field).",
          "gridPos": { "h": 6, "w": 6, "x": 18, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "color": "green", "text": "OK" } } }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"verification_code\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> last()\n  |> max()"
            }
          ]
        },
        {
          "id": 5,
          "title": "Certificate Expiry by Target",
          "type": "table",
          "datasource": "${datasource}",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "color-background" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red" },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Days Remaining" }, "properties": [{ "id": "unit", "value": "d" }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and (r._field == \"expiry\" or r._field == \"verification_code\"))\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> last()\n  |> pivot(rowKey: [\"source\", \"common_name\", \"issuer_common_name\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with expiry: r.expiry / 86400.0 }))\n  |> keep(columns: [\"source\", \"common_name\", \"issuer_common_name\", \"expiry\", \"verification_code\"])\n  |> rename(columns: {source: \"Target\", common_name: \"Common Name\", issuer_common_name: \"Issuer\", expiry: \"Days Remaining\", verification_code: \"Verify Code\"})\n  |> sort(columns: [\"Days Remaining\"])"
            }
          ]
        },
        {
          "id": 6,
          "title": "Days Until Expiry (Trend)",
          "type": "timeseries",
          "datasource": "${datasource}",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "yellow", "value": 14 },
                  { "color": "red", "value": 7 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> map(fn: (r) => ({ r with _value: r._value / 86400.0 }))"
            }
          ]
        }
      ]
    }
