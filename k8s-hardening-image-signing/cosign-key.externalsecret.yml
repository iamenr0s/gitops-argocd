apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cosign-key
  namespace: kyverno
  annotations:
    argocd.argoproj.io/sync-wave: "-1"   # must exist before the verifyImages ClusterPolicy resolves it
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: cosign-key
    creationPolicy: Owner
  data:
    - secretKey: cosign.pub
      remoteRef:
        key: k8s-hardening/cosign
        property: pub
