apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rook-ceph-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/iamenr0s/gitops-argocd.git
    path: rook/ingress
    targetRevision: main
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: rook-ceph
  # Separate app: needs Traefik + cert-manager CRDs, must not block the Ceph cluster sync
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
