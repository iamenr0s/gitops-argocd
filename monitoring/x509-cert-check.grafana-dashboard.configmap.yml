apiVersion: v1
kind: ConfigMap
metadata:
  name: x509-cert-check-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  x509-cert-check.json: |
    {
      "title": "SSL Certificate & HTTP Monitoring (InfluxDB2)",
      "uid": "advblkr",
      "description": "Tracks TLS certificate expiry (Telegraf's x509_cert input) and HTTP endpoint status/response time (Telegraf's http_response input), written to InfluxDB2 and queried with Flux.",
      "tags": ["ssl", "tls", "certificates", "http", "uptime", "security", "influxdb2", "telegraf"],
      "timezone": "browser",
      "schemaVersion": 42,
      "version": 4,
      "editable": true,
      "graphTooltip": 0,
      "refresh": "5m",
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "weekStart": "",
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "title": "Expiring Within 14 Days",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  \n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> filter(fn: (r) => r._value < 14.0)\n  |> group()\n  |> count()\n  |> yield(name: \"count\")"
            }
          ]
        },
        {
          "id": 2,
          "title": "Minimum Days Remaining",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  \n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> group()\n  |> min()"
            }
          ]
        },
        {
          "id": 3,
          "title": "Certificates Monitored",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 0 },
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  \n  |> last()\n  |> group()\n  |> count()"
            }
          ]
        },
        {
          "id": 4,
          "title": "Verification Status",
          "type": "stat",
          "datasource": "influxdb",
          "description": "0 = verified OK. Nonzero means at least one certificate is failing chain/hostname verification (x509_cert's verification_code field).",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "color": "green", "text": "OK" } } }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"verification_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  \n  |> last()\n  |> group()\n  |> max()"
            }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Endpoints Down",
          "type": "stat",
          "datasource": "influxdb",
          "description": "Count of monitored URLs whose last http_response check did not succeed (Telegraf's inputs.http_response result_code field).",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"result_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => true)\n  |> last()\n  |> filter(fn: (r) => r._value != 0)\n  |> group()\n  |> count()\n  |> yield(name: \"count\")"
            }
          ]
        },
        {
          "id": 8,
          "title": "Max Response Time",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 20, "y": 0 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"response_time\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => true)\n  |> last()\n  |> group()\n  |> max()"
            }
          ]
        },
        {
          "id": 5,
          "title": "HTTP Probe Overview",
          "description": "One row per monitored endpoint: HTTP status + response code from Telegraf's http_response input, joined with TLS verification + cert expiry from x509_cert. TLS Version and DNS Lookup Duration columns from the reference dashboard aren't available — neither Telegraf input collects them (that's a blackbox_exporter/Prometheus feature).",
          "type": "table",
          "datasource": "influxdb",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "auto" } }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "mappings", "value": [{ "type": "value", "options": { "UP": { "color": "green", "index": 0 }, "DOWN": { "color": "red", "index": 1 } } }] }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "SSL" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "mappings", "value": [{ "type": "value", "options": { "OK": { "color": "green", "index": 0 }, "FAIL": { "color": "red", "index": 1 } } }] }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Code" },
                "properties": [
                  { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "red", "value": 400 }] } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "SSL Cert Expiry (days)" },
                "properties": [
                  { "id": "unit", "value": "d" },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": 0 }, { "color": "yellow", "value": 14 }, { "color": "green", "value": 30 }] } }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Probe Duration (s)" },
                "properties": [
                  { "id": "unit", "value": "s" },
                  { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "gradient" } },
                  { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": 0 }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] } }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "x509 = from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and (r._field == \"expiry\" or r._field == \"verification_code\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> pivot(rowKey: [\"source\", \"verification\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with expiry: float(v: r.expiry) / 86400.0 }))\n  |> rename(columns: {source: \"instance\"})\n  |> keep(columns: [\"instance\", \"verification\", \"expiry\"])\n\nhttp = from(bucket: \"default\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and (r._field == \"response_time\" or r._field == \"http_response_code\" or r._field == \"result_code\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> last()\n  |> pivot(rowKey: [\"server\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> rename(columns: {server: \"instance\"})\n  |> keep(columns: [\"instance\", \"http_response_code\", \"response_time\", \"result_code\"])\n\njoin(tables: {x509: x509, http: http}, on: [\"instance\"])\n  |> map(fn: (r) => ({ r with\n      status: if r.result_code == 0 then \"UP\" else \"DOWN\",\n      ssl: if r.verification == \"valid\" then \"OK\" else \"FAIL\"\n    }))\n  |> keep(columns: [\"instance\", \"status\", \"http_response_code\", \"ssl\", \"expiry\", \"response_time\"])\n  |> rename(columns: {instance: \"Instance\", status: \"Status\", http_response_code: \"Code\", ssl: \"SSL\", expiry: \"SSL Cert Expiry (days)\", response_time: \"Probe Duration (s)\"})\n  |> group()\n  |> sort(columns: [\"SSL Cert Expiry (days)\"])"
            }
          ]
        },
        {
          "id": 6,
          "title": "HTTP Probe Duration",
          "type": "timeseries",
          "datasource": "influxdb",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["min", "max", "mean"] }
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"default\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"response_time\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => true)"
            }
          ]
        }
      ]
    }
