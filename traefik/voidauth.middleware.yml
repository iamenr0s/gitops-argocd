apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: voidauth
  namespace: traefik
spec:
  forwardAuth:
    address: http://voidauth.voidauth.svc.cluster.local:3000/api/authz/forward-auth
    trustForwardHeader: true
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
