apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  auth-type: {{ .Values.server.auth.type | quote }}
  keygen-mode: {{ .Values.server.keygen.mode | quote }}
  log-level: {{ .Values.server.logging.level | quote }}
  rate-limit-backend: {{ .Values.server.rateLimiting.rps | toString | quote | replace (toString .Values.server.rateLimiting.rps | quote) (toString .Values.server.rateLimiting.rps | quote) }}
  rate-limit-backend: "memory"
  rate-limit-burst: {{ .Values.server.rateLimiting.burst | toString | quote }}
  rate-limit-janitor-interval: "5m"
  rate-limit-rps: {{ .Values.server.rateLimiting.rps | toString | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: agent
    app.kubernetes.io/name: {{ .Release.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
