apiVersion: apps/v1
kind: Deployment
metadata:
  name: certctl-server
  namespace: certctl
  labels:
    app.kubernetes.io/component: server
    app.kubernetes.io/name: certctl
    app.kubernetes.io/instance: certctl
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: certctl
      app.kubernetes.io/name: certctl
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      labels:
        app.kubernetes.io/component: server
        app.kubernetes.io/instance: certctl
        app.kubernetes.io/name: certctl
    spec:
      serviceAccountName: certctl
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: server
          image: harbor.apps.k8s.enros.me/certctl/certctl:2.1.6
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          env:
            - name: CERTCTL_SERVER_HOST
              value: "0.0.0.0"
            - name: CERTCTL_SERVER_PORT
              value: "8443"
            - name: CERTCTL_SERVER_TLS_CERT_PATH
              value: /etc/certctl/tls/tls.crt
            - name: CERTCTL_SERVER_TLS_KEY_PATH
              value: /etc/certctl/tls/tls.key
            - name: CERTCTL_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: certctl-server
                  key: database-url
            - name: CERTCTL_LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: log-level
            - name: CERTCTL_LOG_FORMAT
              value: json
            - name: CERTCTL_AUTH_TYPE
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: auth-type
            - name: CERTCTL_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: certctl-server
                  key: api-key
            - name: CERTCTL_KEYGEN_MODE
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: keygen-mode
            - name: CERTCTL_RATE_LIMIT_RPS
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: rate-limit-rps
            - name: CERTCTL_RATE_LIMIT_BURST
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: rate-limit-burst
            - name: CERTCTL_RATE_LIMIT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: rate-limit-backend
            - name: CERTCTL_RATE_LIMIT_JANITOR_INTERVAL
              valueFrom:
                configMapKeyRef:
                  name: certctl-server
                  key: rate-limit-janitor-interval
          livenessProbe:
            httpGet:
              path: /health
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls
              mountPath: /etc/certctl/tls
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            defaultMode: 0400
            secretName: certctl-server-tls
