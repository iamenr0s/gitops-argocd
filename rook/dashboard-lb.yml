apiVersion: v1
kind: Service
metadata:
  name: rook-ceph-mgr-dashboard-lb
  annotations:
    argocd.argoproj.io/ignore-healthcheck: "true"
spec:
  type: LoadBalancer
  selector:
    app: rook-ceph-mgr
    rook_cluster: rook-ceph
    mgr_role: active
  ports:
    - name: https-dashboard
      port: 8443
      targetPort: 8443
