apiVersion: v1
kind: ServiceAccount
metadata:
  name: kadalu-storage-generator
  namespace: kadalu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kadalu-storage-generator
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get","list","watch"]
- apiGroups: ["kadalu-operator.storage"]
  resources: ["kadalustorages"]
  verbs: ["get","list","create","patch","update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kadalu-storage-generator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kadalu-storage-generator
subjects:
- kind: ServiceAccount
  name: kadalu-storage-generator
  namespace: kadalu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kadalu-storage-generator
  namespace: kadalu
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kadalu-disk-discovery"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kadalu-storage-generator
  namespace: kadalu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kadalu-storage-generator
subjects:
- kind: ServiceAccount
  name: kadalu-storage-generator
  namespace: kadalu
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kadalu-disk-discovery
  namespace: kadalu
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kadalu-disk-discovery
  namespace: kadalu
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  resourceNames: ["kadalu-disk-discovery"]
  verbs: ["get","patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kadalu-disk-discovery
  namespace: kadalu
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kadalu-disk-discovery
subjects:
- kind: ServiceAccount
  name: kadalu-disk-discovery
  namespace: kadalu
---
# result store: one key per node (node name -> /dev/xxx or none), written by the DaemonSet
apiVersion: v1
kind: ConfigMap
metadata:
  name: kadalu-disk-discovery
  namespace: kadalu
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kadalu-storage-generator
  namespace: kadalu
data:
  # Runs on every node that is not labelled control-plane/master. Records, in ConfigMap kadalu-disk-discovery under the node name, the first whole disk that is
  # empty: no partitions, not held by LVM/md, first and last 1 MiB all zero (a mounted
  # or formatted disk has a non-zero superblock, so it is skipped too).
  # "none" if there is no such disk. An existing entry is never changed, so a disk
  # that kadalu has already formatted is not replaced by another one.
  discover.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    cur=$(kubectl -n kadalu get cm kadalu-disk-discovery -o go-template="{{index .data \"$NODE_NAME\"}}" 2>/dev/null || true)
    [ "$cur" = "<no value>" ] && cur=
    zero() { # zero <disk> <mib offset>: 1 MiB at that offset is all zeros
      [ -z "$(dd if=/dev/$1 bs=1M count=1 skip=$2 2>/dev/null | tr -d '\0' | head -c1)" ]
    }
    if [ -z "$cur" ]; then
      dev=none
      for b in $(ls /sys/block | sort); do
        case $b in loop*|ram*|zram*|dm-*|md*|nbd*|sr*|fd*) continue;; esac
        sectors=$(cat /sys/block/$b/size)
        [ "$sectors" -gt 4096 ] || continue
        ls -d /sys/block/$b/$b* >/dev/null 2>&1 && continue
        [ -z "$(ls /sys/block/$b/holders)" ] || continue
        zero $b 0 && zero $b $((sectors / 2048 - 1)) || continue
        dev=/dev/$b
        break
      done
      echo "$NODE_NAME: $dev"
      kubectl -n kadalu patch cm kadalu-disk-discovery --type merge -p "{\"data\":{\"$NODE_NAME\":\"$dev\"}}"
    else
      echo "$NODE_NAME: already $cur"
    fi
    exec sleep infinity
  gen.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    NAME="${NAME:-kadalu-pool-replica3}"
    # nodes labelled control-plane/master are skipped; remove the label to include one
    SELECTOR="${SELECTOR:-!node-role.kubernetes.io/control-plane,!node-role.kubernetes.io/master}"
    echo "waiting for KadaluStorage CRD..."
    for i in {1..60}; do
      if kubectl get crd kadalustorages.kadalu-operator.storage >/dev/null 2>&1; then break; fi
      sleep 5
    done
    echo "waiting for every worker to report a disk..."
    for i in {1..60}; do
      MAP=$(kubectl -n kadalu get cm kadalu-disk-discovery -o go-template='{{range $k,$v := .data}}{{$k}} {{$v}}{{"\n"}}{{end}}')
      LIST=""
      ready=1
      for n in $(kubectl get nodes --selector="$SELECTOR" -o jsonpath='{.items[*].metadata.name}'); do
        dev=$(awk -v n="$n" '$1 == n {print $2}' <<<"$MAP")
        [ -n "$dev" ] || ready=0
        LIST+="$n $dev"$'\n'
      done
      [ -n "$LIST" ] && [ "$ready" = 1 ] && break
      sleep 5
    done
    NODES=$(awk '$2 ~ /^\/dev\// {print}' <<<"$LIST")
    if [ -z "$NODES" ]; then
      echo "no worker with an empty disk found" >&2
      exit 1
    fi
    {
      echo "apiVersion: kadalu-operator.storage/v1alpha1"
      echo "kind: KadaluStorage"
      echo "metadata:"
      echo "  name: ${NAME}"
      echo "spec:"
      echo "  type: Replica3"
      echo "  storage:"
      while read -r n dev; do
        echo "    - node: ${n}"
        echo "      device: ${dev}"
      done <<<"$NODES"
    } | kubectl apply -f -
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kadalu-disk-discovery
  namespace: kadalu
spec:
  selector:
    matchLabels:
      app: kadalu-disk-discovery
  template:
    metadata:
      labels:
        app: kadalu-disk-discovery
    spec:
      serviceAccountName: kadalu-disk-discovery
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - {key: node-role.kubernetes.io/control-plane, operator: DoesNotExist}
              - {key: node-role.kubernetes.io/master, operator: DoesNotExist}
      tolerations:
      - operator: Exists
      containers:
      - name: discover
        image: bitnami/kubectl:latest
        command: ["/bin/bash","/scripts/discover.sh"]
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
          runAsUser: 0
        resources:
          requests: {cpu: 5m, memory: 16Mi}
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: dev
          mountPath: /dev
          readOnly: true
      volumes:
      - name: scripts
        configMap:
          name: kadalu-storage-generator
          defaultMode: 0755
      - name: dev
        hostPath:
          path: /dev
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kadalu-storage-generator
  namespace: kadalu
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  template:
    spec:
      serviceAccountName: kadalu-storage-generator
      restartPolicy: OnFailure
      containers:
      - name: generator
        image: bitnami/kubectl:latest
        command: ["/bin/bash","/scripts/gen.sh"]
        env:
        - name: NAME
          value: "kadalu-pool-replica3"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: kadalu-storage-generator
          defaultMode: 0755
