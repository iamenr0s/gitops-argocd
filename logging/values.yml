kubeVersionOverride: ''
enabled: true
global:
  imageRegistry: null
  image:
    registry: null
  priorityClassName: null
  clusterDomain: cluster.local
  dnsService: kube-dns
  dnsNamespace: kube-system
  extraArgs: []
  extraEnv: []
  extraEnvFrom:
  - secretRef:
      name: loki-s3
  extraVolumes: []
  extraVolumeMounts: []
nameOverride: ''
fullnameOverride: ''
namespaceOverride: logging
imagePullSecrets: []
deploymentMode: Monolithic
commonLabels: {}
defaults:
  goSettings:
    goMemLimitFactor: 0.85
    gogc: 80
  dnsConfig: {}
  hostAliases: []
  hostUsers: null
  priorityClassName: ''
  podSecurityContext: {}
  terminationGracePeriodSeconds: 30
  command: null
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumes: []
  extraVolumeMounts: []
  containerSecurityContext: {}
  livenessProbe: {}
  readinessProbe: {}
  startupProbe: {}
  nodeSelector: {}
  tolerations: []
  automountServiceAccountToken: true
  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}
  enableServiceLinks: true
  service:
    annotations: {}
    labels: {}
    trafficDistribution: ''
    ipFamilyPolicy: ''
    ipFamilies: []
    publishNotReadyAddresses: true
    headlessService:
      annotations: {}
      labels: {}
  kedaAutoscaling:
    prometheusAddress: ''
    unsafeSsl: false
    ignoreNullValues: true
    customHeaders: ''
    pollingInterval: 30
    cooldownPeriod: 300
    authentication:
      enabled: false
      authModes: ''
      secretTargetRef: []
  statefulSetRecreateJob:
    patchPVC: true
    image:
      registry: registry.k8s.io
      repository: kubectl
      tag: ''
loki:
  livenessProbe:
    httpGet:
      path: /loki/api/v1/status/buildinfo
      port: http-metrics
    periodSeconds: 30
    successThreshold: 1
    failureThreshold: 10
    timeoutSeconds: 1
  readinessProbe:
    httpGet:
      path: /ready
      port: http-metrics
    periodSeconds: 10
    initialDelaySeconds: 15
    successThreshold: 1
    failureThreshold: 3
    timeoutSeconds: 1
  startupProbe: {}
  image:
    registry: docker.io
    repository: grafana/loki
    tag: latest
    digest: null
    pullPolicy: IfNotPresent
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  serviceAnnotations: {}
  serviceLabels: {}
  revisionHistoryLimit: 10
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  enableServiceLinks: true
  dnsConfig: {}
  configStorageType: ConfigMap
  configObjectName: '{{ include "loki.name" . }}'
  generatedConfigObjectName: '{{ include "loki.name" . }}'
  config: |
    auth_enabled: {{ .Values.loki.auth_enabled }}

    {{- with .Values.loki.server }}
    server:
      {{- toYaml . | nindent 2}}
    {{- end}}

    {{- with .Values.loki.pattern_ingester }}
    pattern_ingester:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    memberlist:
    {{- if .Values.loki.memberlistConfig }}
      {{- toYaml .Values.loki.memberlistConfig | nindent 2 }}
    {{- else }}
    {{- if .Values.loki.extraMemberlistConfig}}
    {{- toYaml .Values.loki.extraMemberlistConfig | nindent 2}}
    {{- end }}
      join_members:
        - {{ include "loki.memberlist" . }}.{{ include "loki.namespace" $ }}.svc.{{ .Values.global.clusterDomain }}
        {{- with .Values.migrate.fromDistributed }}
        {{- if .enabled }}
        - {{ .memberlistService }}
        {{- end }}
        {{- end }}
    {{- end }}

    {{- with .Values.loki.ingester }}
    ingester:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.ingester_client }}
    ingester_client:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.block_builder }}
    block_builder:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- if .Values.loki.commonConfig}}
    common:
    {{- toYaml .Values.loki.commonConfig | nindent 2}}
      storage:
      {{- include "loki.commonStorageConfig" . | nindent 4}}
    {{- end}}

    {{- with .Values.loki.limits_config }}
    limits_config:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    runtime_config:
      file: /etc/loki/runtime-config/runtime-config.yaml

    {{- if .Values.chunksCache.enabled }}
    {{- with .Values.chunksCache }}
    chunk_store_config:
      chunk_cache_config:
        default_validity: {{ .defaultValidity }}
        background:
          writeback_goroutines: {{ .writebackParallelism }}
          writeback_buffer: {{ .writebackBuffer }}
          writeback_size_limit: {{ .writebackSizeLimit }}
        memcached:
          batch_size: {{ .batchSize }}
          parallelism: {{ .parallelism }}
        memcached_client:
          addresses: {{ .addresses }}
          consistent_hash: true
          timeout: {{ .timeout }}
          max_idle_conns: 72
      {{- end }}
      {{- with .Values.chunksCache.l2 }}
      {{- if .enabled }}
      l2_chunk_cache_handoff: {{ .l2ChunkCacheHandoff }}
      chunk_cache_config_l2:
        default_validity: {{ .defaultValidity }}
        background:
          writeback_goroutines: {{ .writebackParallelism }}
          writeback_buffer: {{ .writebackBuffer }}
          writeback_size_limit: {{ .writebackSizeLimit }}
        memcached:
          batch_size: {{ .batchSize }}
          parallelism: {{ .parallelism }}
        memcached_client:
          addresses: {{ .addresses }}
          consistent_hash: true
          timeout: {{ .timeout }}
          max_idle_conns: 72
      {{- end }}
      {{- end }}
    {{- end }}

    {{- if .Values.loki.schemaConfig }}
    schema_config:
    {{- toYaml .Values.loki.schemaConfig | nindent 2}}
    {{- end }}

    {{- if .Values.loki.useTestSchema }}
    schema_config:
    {{- toYaml .Values.loki.testSchemaConfig | nindent 2}}
    {{- end }}

    {{- if .Values.ruler.enabled }}
    {{ include "loki.rulerConfig" . }}
    {{- end }}

    {{- if and .Values.loki.storage.use_thanos_objstore .Values.ruler.enabled}}
    ruler_storage:
      {{- include "loki.rulerThanosStorageConfig" . | nindent 2 }}
    {{- end }}

    {{- if or .Values.tableManager.retention_deletes_enabled .Values.tableManager.retention_period }}
    table_manager:
      retention_deletes_enabled: {{ .Values.tableManager.retention_deletes_enabled }}
      retention_period: {{ .Values.tableManager.retention_period }}
    {{- end }}

    query_range:
      align_queries_with_step: true
      {{- with .Values.loki.query_range }}
      {{- tpl (. | toYaml) $ | nindent 2 }}
      {{- end }}
      {{- if .Values.resultsCache.enabled }}
      {{- with .Values.resultsCache }}
      cache_results: true
      results_cache:
        cache:
          default_validity: {{ .defaultValidity }}
          background:
            writeback_goroutines: {{ .writebackParallelism }}
            writeback_buffer: {{ .writebackBuffer }}
            writeback_size_limit: {{ .writebackSizeLimit }}
          memcached_client:
            addresses: {{ .addresses }}
            consistent_hash: true
            timeout: {{ .timeout }}
            update_interval: 1m
      {{- end }}
      {{- end }}

    {{- with .Values.loki.storage_config }}
    storage_config:
        {{- if not (hasKey $.Values.loki.storage_config "use_thanos_objstore") }}
        use_thanos_objstore: {{ $.Values.loki.storage.use_thanos_objstore }}
        {{- end }}
        {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.query_scheduler }}
    query_scheduler:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.compactor }}
    compactor:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.compactor_grpc_client }}
    compactor_grpc_client:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.analytics }}
    analytics:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- if .Values.loki.ui.enabled }}
    ui:
      enabled: true
    {{- end }}
    {{- with .Values.loki.querier }}
    querier:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.index_gateway }}
    index_gateway:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.frontend }}
    frontend:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.frontend_worker }}
    frontend_worker:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.distributor }}
    distributor:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    tracing:
      enabled: {{ .Values.loki.tracing.enabled }}

    {{- with .Values.loki.bloom_build }}
    bloom_build:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.bloom_gateway }}
    bloom_gateway:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}

    {{- with .Values.loki.operational_config }}
    operational_config:
      {{- tpl (. | toYaml) $ | nindent 4 }}
    {{- end }}
  auth_enabled: true
  memberlistConfig: {}
  extraMemberlistConfig:
    abort_if_cluster_join_fails: true
    advertise_port: 7946
    bind_port: 7946
    max_join_backoff: 1m
    max_join_retries: 10
    min_join_backoff: 1s
    rejoin_interval: 90s
  tenants: []
  server:
    graceful_shutdown_timeout: 5s
    grpc_listen_port: 9095
    grpc_server_min_time_between_pings: 10s
    grpc_server_ping_without_stream_allowed: true
    grpc_server_max_concurrent_streams: 1000
    grpc_server_max_recv_msg_size: 104857600
    grpc_server_max_send_msg_size: 104857600
    http_listen_port: 3100
    http_server_idle_timeout: 30s
    http_server_read_timeout: 10m0s
    http_server_write_timeout: 10m0s
    log_level: info
  service:
    trafficDistribution: ''
    ipFamilyPolicy: ''
    ipFamilies: []
    headlessService:
      annotations: {}
  limits_config:
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_cache_freshness_per_query: 10m
    split_queries_by_interval: 15m
    query_timeout: 300s
    volume_enabled: true
    retention_period: 240h
  runtimeConfig: {}
  commonConfig:
    path_prefix: /var/loki
    replication_factor: 1
    compactor_grpc_address: '{{ include "loki.compactorAddress" . }}'
  storage:
    type: s3
    s3:
      s3: null
      endpoint: ${S3_ENDPOINT}
      region: ${AWS_REGION}
      secretAccessKey: ${AWS_SECRET_ACCESS_KEY}
      accessKeyId: ${AWS_ACCESS_KEY_ID}
      signatureVersion: null
      s3ForcePathStyle: true
      insecure: false
      http_config: {}
      backoff_config: {}
      disable_dualstack: false
    gcs:
      chunkBufferSize: 0
      requestTimeout: 0s
      enableHttp2: true
    azure:
      accountName: null
      accountKey: null
      connectionString: null
      useManagedIdentity: false
      useFederatedToken: false
      userAssignedId: null
      requestTimeout: null
      endpointSuffix: null
      chunkDelimiter: null
    swift:
      auth_version: null
      auth_url: null
      internal: null
      username: null
      user_domain_name: null
      user_domain_id: null
      user_id: null
      password: null
      domain_id: null
      domain_name: null
      project_id: null
      project_name: null
      project_domain_id: null
      project_domain_name: null
      region_name: null
      container_name: null
      max_retries: null
      connect_timeout: null
      request_timeout: null
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules
    use_thanos_objstore: false
    object_store:
      type: s3
      storage_prefix: null
      s3:
        endpoint: ${S3_ENDPOINT}
        region: ${AWS_REGION}
        access_key_id: ${AWS_ACCESS_KEY_ID}
        secret_access_key: ${AWS_SECRET_ACCESS_KEY}
        insecure: false
        sse: {}
        http: {}
      gcs:
        bucket_name: null
        service_account: null
      azure:
        account_name: null
        account_key: null
    bucketNames:
      chunks: ${S3_BUCKET}
      ruler: ${S3_BUCKET}
      admin: ${S3_BUCKET}
  schemaConfig:
    configs:
    - from: '2024-04-01'
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h
  useTestSchema: false
  testSchemaConfig:
    configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
  rulerConfig:
    wal:
      dir: /var/loki/ruler-wal
  structuredConfig: {}
  query_scheduler: {}
  storage_config:
    boltdb_shipper:
      index_gateway_client:
        server_address: '{{ include "loki.indexGatewayAddress" . }}'
    tsdb_shipper:
      index_gateway_client:
        server_address: '{{ include "loki.indexGatewayAddress" . }}'
    bloom_shipper:
      working_directory: /var/loki/data/bloomshipper
    hedging:
      at: 250ms
      max_per_second: 20
      up_to: 3
  compactor:
    working_directory: /var/loki/compactor
    delete_request_store: filesystem
    retention_enabled: true
  compactor_grpc_client: {}
  pattern_ingester:
    enabled: false
  analytics: {}
  ui:
    enabled: false
    gateway:
      enabled: true
  query_range: {}
  querier: {}
  ingester:
    wal:
      flush_on_shutdown: true
  ingester_client: {}
  block_builder: {}
  index_gateway:
    mode: simple
  frontend:
    scheduler_address: '{{ include "loki.querySchedulerAddress" . }}'
    tail_proxy_url: '{{ include "loki.querierAddress" . }}'
  frontend_worker:
    scheduler_address: '{{ include "loki.querySchedulerAddress" . }}'
  distributor: {}
  tracing:
    enabled: false
  bloom_build:
    enabled: false
    builder:
      planner_address: '{{ include "loki.bloomPlannerAddress" . }}'
  bloom_gateway:
    enabled: false
    client:
      addresses: '{{ include "loki.bloomGatewayAddresses" . }}'
  operational_config: {}
test:
  enabled: true
  canaryServiceAddress: http://{{ include "loki.resourceName" (dict "ctx" $ "component" "canary") }}.{{ include "loki.namespace" $ }}.svc.{{ .Values.global.clusterDomain }}:3500/metrics
  prometheusAddress: ''
  timeout: 1m
  labels: {}
  annotations: {}
  image:
    registry: docker.io
    repository: grafana/loki-helm-test
    tag: latest
    digest: null
    pullPolicy: IfNotPresent
  hostUsers: null
lokiCanary:
  enabled: true
  kind: DaemonSet
  push: true
  lokiurl: null
  labelname: pod
  annotations: {}
  labels: {}
  podAnnotations: {}
  podLabels: {}
  revisionHistoryLimit: 10
  service:
    annotations: {}
    labels: {}
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  extraVolumeMounts: []
  extraVolumes: []
  resources: {}
  resizePolicy: []
  dnsConfig: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  automountServiceAccountToken: false
  priorityClassName: null
  hostUsers: null
  podDisruptionBudget:
    enabled: true
    annotations: {}
    labels: {}
    minAvailable: null
    maxUnavailable: null
    unhealthyPodEvictionPolicy: null
  podSecurityContext:
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    allowPrivilegeEscalation: false
    seccompProfile:
      type: RuntimeDefault
  image:
    registry: docker.io
    repository: grafana/loki-canary
    tag: null
    digest: null
    pullPolicy: IfNotPresent
  livenessProbe:
    httpGet:
      path: /metrics
      port: http-metrics
    initialDelaySeconds: 15
    timeoutSeconds: 1
  readinessProbe:
    httpGet:
      path: /metrics
      port: http-metrics
    initialDelaySeconds: 15
    timeoutSeconds: 1
  startupProbe: {}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  replicas: 1
  tenant:
    name: self-monitoring
    password: null
    bearerToken:
      enabled: false
      audience: '{{ include "loki.name" . }}.{{ include "loki.namespace" . }}'
      expirationSeconds: 3600
  serviceAccount:
    create: true
    name: null
    imagePullSecrets: []
    annotations: {}
    labels: {}
    automountServiceAccountToken: false
serviceAccount:
  create: true
  name: null
  imagePullSecrets: []
  annotations: {}
  labels: {}
  automountServiceAccountToken: true
rbac:
  sccEnabled: false
  sccAllowHostDirVolumePlugin: false
  namespaced: false
networkPolicy:
  enabled: false
  gatewayJwks:
    cidrs: []
  metrics:
    podSelector: {}
    namespaceSelector: {}
    cidrs: []
  ingress:
    podSelector: {}
    namespaceSelector: {}
  alertmanager:
    port: 9093
    podSelector: {}
    namespaceSelector: {}
  externalStorage:
    ports: []
    cidrs: []
  discovery:
    port: null
    podSelector: {}
    namespaceSelector: {}
memberlist:
  service:
    publishNotReadyAddresses: false
    annotations: {}
gateway:
  enabled: false
  type: nginx
  replicas: 1
  containerPort: 8080
  verboseLogging: true
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 60
    targetMemoryUtilizationPercentage: null
    behavior: {}
  kedaAutoscaling:
    enabled: false
    pollingInterval: null
    minReplicas: 1
    maxReplicas: 3
    cooldownPeriod: null
    fallback: {}
    behavior: {}
    triggers: []
  deploymentStrategy:
    type: RollingUpdate
  image:
    registry: docker.io
    repository: nginxinc/nginx-unprivileged
    tag: 1.31-alpine
    digest: null
    pullPolicy: IfNotPresent
  envoy:
    image:
      registry: docker.io
      repository: envoyproxy/envoy
      tag: distroless-v1.39.1
      digest: null
      pullPolicy: IfNotPresent
  priorityClassName: null
  annotations: {}
  podAnnotations: {}
  podLabels: {}
  extraArgs: []
  extraEnv: []
  extraEnvFrom: []
  lifecycle: {}
  extraVolumes: []
  extraVolumeMounts: []
  podSecurityContext:
    fsGroup: 101
    runAsGroup: 101
    runAsNonRoot: true
    runAsUser: 101
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    readOnlyRootFilesystem: true
    capabilities:
      drop:
      - ALL
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
  hostUsers: null
  resources: {}
  resizePolicy: []
  extraContainers: []
  terminationGracePeriodSeconds: 30
  podDisruptionBudget:
    enabled: false
    annotations: {}
    labels: {}
    minAvailable: null
    maxUnavailable: null
    unhealthyPodEvictionPolicy: null
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/component: gateway
            app.kubernetes.io/name: '{{ include "loki.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
        topologyKey: kubernetes.io/hostname
  dnsConfig: {}
  nodeSelector: {}
  automountServiceAccountToken: false
  topologySpreadConstraints: []
  tolerations: []
  service:
    port: 80
    type: ClusterIP
    clusterIP: null
    nodePort: null
    loadBalancerIP: null
    annotations: {}
    labels: {}
    trafficDistribution: ''
    sessionAffinity: ''
    sessionAffinityConfig: {}
    ipFamilyPolicy: ''
    ipFamilies: []
  serviceAccount:
    create: false
    name: null
    imagePullSecrets: []
    annotations: {}
    labels: {}
    automountServiceAccountToken: false
  ingress:
    enabled: false
    ingressClassName: ''
    annotations: {}
    labels: {}
    hosts:
    - host: gateway.loki.example.com
      paths:
      - path: /
    tls:
    - secretName: loki-gateway-tls
      hosts:
      - gateway.loki.example.com
  basicAuth:
    enabled: false
    username: null
    password: null
    passwordHash: null
    htpasswd: |
      {{- $isEnvoy := eq .Values.gateway.type "envoy" }}
      {{- with $tenants := .Values.loki.tenants }}
        {{- range $t := $tenants }}
          {{- $tenantName := required "All tenants must have a 'name' set" $t.name }}
          {{- $username := ternary ($t.basicAuthUsername | default $tenantName) $tenantName $isEnvoy }}
          {{- if and $isEnvoy (or $t.passwordHash $t.password) }}
            {{- $passwordHash := $t.passwordHash }}
            {{- if not $passwordHash }}
              {{- $passwordHash = include "loki.gatewayEnvoySHA1" (required "All tenants must have a 'password' or 'passwordHash' set" $t.password) }}
            {{- end }}
            {{- if not (regexMatch "^\\{SHA\\}[A-Za-z0-9+/]{27}=$" $passwordHash) }}
              {{- fail "Envoy Basic Auth passwordHash values must contain a valid {SHA} Base64-encoded SHA-1 digest" }}
            {{- end }}
            {{- printf "%s:%s\n" $username $passwordHash }}
          {{- else if $isEnvoy }}
            {{- if not (or $t.jwtSubClaim $t.clientCertificateCN) }}
              {{- fail (printf "Tenant %q must set 'password' or 'passwordHash', or an Envoy identity (jwtSubClaim or clientCertificateCN)" $tenantName) }}
            {{- end }}
          {{- else }}
            {{- if $passwordHash := $t.passwordHash }}
            {{- printf "%s:%s\n" $username $passwordHash }}
            {{- else if $password := $t.password }}
            {{- printf "%s\n" (htpasswd $username $password) }}
            {{- else }}
            {{- fail "All tenants must have a 'password' or 'passwordHash' set" }}
            {{- end }}
          {{- end }}
        {{- end }}
      {{- else }}
        {{- $username := required "'gateway.basicAuth.username' is required" .Values.gateway.basicAuth.username }}
        {{- if $isEnvoy }}
          {{- $passwordHash := .Values.gateway.basicAuth.passwordHash }}
          {{- if not $passwordHash }}
            {{- $passwordHash = include "loki.gatewayEnvoySHA1" (required "'gateway.basicAuth.password' or 'gateway.basicAuth.passwordHash' is required for the Envoy gateway" .Values.gateway.basicAuth.password) }}
          {{- end }}
          {{- if not (regexMatch "^\\{SHA\\}[A-Za-z0-9+/]{27}=$" $passwordHash) }}
            {{- fail "gateway.basicAuth.passwordHash must use the {SHA} format for the Envoy gateway" }}
          {{- end }}
          {{- printf "%s:%s\n" $username $passwordHash }}
        {{- else }}
          {{- printf "%s\n" (htpasswd $username (required "'gateway.basicAuth.password' is required" .Values.gateway.basicAuth.password)) }}
        {{- end }}
      {{- end }}
    existingSecret: null
  route:
    main:
      enabled: false
      apiVersion: ''
      kind: HTTPRoute
      annotations: {}
      labels: {}
      hostnames: []
