# The harbor chart hardcodes livenessProbe.initialDelaySeconds=300 with no
# values.yml override, giving a 330s kill window (300 + 3*10). PostgreSQL
# crash-recovery fsync on kadalu's FUSE-backed storage routinely exceeds that,
# so liveness SIGTERMs postgres mid-recovery in an infinite restart loop.
# This patch is applied as a separate ArgoCD source alongside the Helm chart;
# kubectl's strategic merge adds startupProbe without touching chart-managed
# fields, deferring liveness/readiness until startup actually succeeds.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: harbor-database
  namespace: harbor
  annotations:
    # Required: plain client-side apply rejects this partial object (missing
    # selector/labels/image) since it validates as a full StatefulSet first.
    # Server-Side Apply merges by field ownership instead.
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  template:
    spec:
      containers:
        - name: database
          startupProbe:
            exec:
              command:
                - /docker-healthcheck.sh
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
