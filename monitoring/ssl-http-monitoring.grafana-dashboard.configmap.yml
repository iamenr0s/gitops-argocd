apiVersion: v1
kind: ConfigMap
metadata:
  name: ssl-http-monitoring-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  ssl-http-monitoring.json: |
    {
      "title": "SSL Certificate & HTTP Monitoring (Enhanced)",
      "uid": "ssl-http-monitoring",
      "description": "Comprehensive monitoring for SSL certificate expiry, verification status, and HTTP endpoint health with response times. Updated to use telegraf_class tag.",
      "tags": ["ssl", "tls", "certificates", "http", "uptime", "security", "influxdb2", "telegraf"],
      "timezone": "browser",
      "schemaVersion": 42,
      "version": 2,
      "editable": true,
      "graphTooltip": 0,
      "refresh": "1m",
      "time": { "from": "now-24h", "to": "now" },
      "timepicker": {},
      "weekStart": "",
      "links": [],
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "bucket",
            "type": "textbox",
            "query": "default",
            "current": { "value": "default" }
          },
          {
            "name": "source",
            "type": "query",
            "datasource": "influxdb",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "options": [],
            "query": "from(bucket: \"${bucket}\") |> range(start: -10m) |> filter(fn: (r) => r._measurement == \"x509_cert\") |> distinct(column: \"source\") |> keep(columns: [\"source\"])"
          },
          {
            "name": "common_name",
            "type": "query",
            "datasource": "influxdb",
            "includeAll": true,
            "multi": true,
            "refresh": 2,
            "options": [],
            "query": "from(bucket: \"${bucket}\") |> range(start: -10m) |> filter(fn: (r) => r._measurement == \"x509_cert\") |> distinct(column: \"common_name\") |> keep(columns: [\"common_name\"])"
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "SSL Overview",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "collapsed": false
        },
        {
          "id": 2,
          "title": "Critical: Expiring Within 7 Days",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 1 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> filter(fn: (r) => r._value < 7.0)\n  |> count()\n  |> yield(name: \"critical\")"
            }
          ]
        },
        {
          "id": 3,
          "title": "Warning: Expiring Within 30 Days",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 1 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> filter(fn: (r) => r._value < 30.0 and r._value >= 7.0)\n  |> count()\n  |> yield(name: \"warning\")"
            }
          ]
        },
        {
          "id": 4,
          "title": "Minimum Days Remaining",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 1 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))\n  |> min()"
            }
          ]
        },
        {
          "id": 5,
          "title": "Certificates Monitored",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 1 },
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> count()"
            }
          ]
        },
        {
          "id": 6,
          "title": "Verification Status",
          "type": "stat",
          "datasource": "influxdb",
          "description": "0 = verified OK. Nonzero means at least one certificate is failing chain/hostname verification.",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 1 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "mappings": [{ "type": "value", "options": { "0": { "color": "green", "text": "OK" } } }],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"verification_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> max()"
            }
          ]
        },
        {
          "id": 7,
          "title": "HTTP Overview",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 7 },
          "collapsed": false
        },
        {
          "id": 8,
          "title": "HTTP Endpoints Down",
          "type": "stat",
          "datasource": "influxdb",
          "description": "Count of monitored URLs whose last http_response check did not succeed.",
          "gridPos": { "h": 6, "w": 4, "x": 0, "y": 8 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"result_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> filter(fn: (r) => r._value != 0)\n  |> count()\n  |> yield(name: \"down\")"
            }
          ]
        },
        {
          "id": 9,
          "title": "Max Response Time",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 4, "y": 8 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"response_time\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> max()"
            }
          ]
        },
        {
          "id": 10,
          "title": "Average Response Time",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 8, "y": 8 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "yellow", "value": 0.3 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"response_time\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> mean()"
            }
          ]
        },
        {
          "id": 11,
          "title": "HTTP Endpoints Monitored",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 12, "y": 8 },
          "options": { "colorMode": "value", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"result_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> count()"
            }
          ]
        },
        {
          "id": 12,
          "title": "Success Rate",
          "type": "stat",
          "datasource": "influxdb",
          "gridPos": { "h": 6, "w": 4, "x": 16, "y": 8 },
          "options": { "colorMode": "background", "reduceOptions": { "calcs": ["lastNotNull"] } },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": 0 },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"result_code\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> map(fn: (r) => ({ r with success: if r._value == 0 then 1.0 else 0.0 }))\n  |> mean(column: \"success\")\n  |> map(fn: (r) => ({ r with _value: r._value * 100.0 }))"
            }
          ]
        },
        {
          "id": 13,
          "title": "Certificate Details",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 14 },
          "collapsed": false
        },
        {
          "id": 14,
          "title": "Certificate Expiry by Target",
          "type": "table",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 15 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "color-background" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red" },
                  { "color": "yellow", "value": 14 },
                  { "color": "green", "value": 30 }
                ]
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Days Remaining" }, "properties": [{ "id": "unit", "value": "d" }] },
              { "matcher": { "id": "byName", "options": "Verify Code" }, "properties": [{ "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "red", "value": 1 }] } }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and (r._field == \"expiry\" or r._field == \"verification_code\" or r._field == \"verification_error\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> last()\n  |> pivot(rowKey: [\"source\", \"common_name\", \"issuer_common_name\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> map(fn: (r) => ({ r with expiry: float(v: r.expiry) / 86400.0 }))\n  |> keep(columns: [\"source\", \"common_name\", \"issuer_common_name\", \"expiry\", \"verification_code\", \"verification_error\"])\n  |> rename(columns: {source: \"Target\", common_name: \"Common Name\", issuer_common_name: \"Issuer\", expiry: \"Days Remaining\", verification_code: \"Verify Code\", verification_error: \"Verify Error\"})\n  |> sort(columns: [\"Days Remaining\"])"
            }
          ]
        },
        {
          "id": 15,
          "title": "HTTP Response Details",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 25 },
          "collapsed": false
        },
        {
          "id": 16,
          "title": "HTTP Response Status by Target",
          "type": "table",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 26 },
          "fieldConfig": {
            "defaults": {
              "custom": { "cellOptions": { "type": "color-background" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": 0 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Response Time (s)" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "yellow", "value": 0.5 }, { "color": "red", "value": 1 }] } }] },
              { "matcher": { "id": "byName", "options": "Result Code" }, "properties": [{ "id": "custom.cellOptions", "value": { "type": "color-background" } }] }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: -10m)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and (r._field == \"response_time\" or r._field == \"http_response_code\" or r._field == \"result_code\" or r._field == \"result\"))\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))\n  |> last()\n  |> pivot(rowKey: [\"server\", \"method\", \"result\", \"status_code\"], columnKey: [\"_field\"], valueColumn: \"_value\")\n  |> keep(columns: [\"server\", \"method\", \"result\", \"status_code\", \"http_response_code\", \"response_time\", \"result_code\"])\n  |> rename(columns: {server: \"Target\", method: \"Method\", result: \"Result\", status_code: \"Status Code\", http_response_code: \"HTTP Code\", response_time: \"Response Time (s)\", result_code: \"Result Code\"})\n  |> sort(columns: [\"Target\"])"
            }
          ]
        },
        {
          "id": 17,
          "title": "Time Series Analysis",
          "type": "row",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 36 },
          "collapsed": false
        },
        {
          "id": 18,
          "title": "Days Until Expiry (Trend)",
          "type": "timeseries",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 37 },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "yellow", "value": 14 },
                  { "color": "red", "value": 7 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"x509_cert\" and r._field == \"expiry\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.source, set: ${source:json}))\n  |> filter(fn: (r) => contains(value: r.common_name, set: ${common_name:json}))\n  |> map(fn: (r) => ({ r with _value: float(v: r._value) / 86400.0 }))"
            }
          ]
        },
        {
          "id": 19,
          "title": "HTTP Response Time (Trend)",
          "type": "timeseries",
          "datasource": "influxdb",
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 37 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green" },
                  { "color": "yellow", "value": 0.5 },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "query": "from(bucket: \"${bucket}\")\n  |> range(start: v.timeRangeStart, stop: v.timeRangeStop)\n  |> filter(fn: (r) => r._measurement == \"http_response\" and r._field == \"response_time\")\n  |> filter(fn: (r) => r.telegraf_class == \"x509-cert-check\")\n  |> filter(fn: (r) => contains(value: r.server, set: ${source:json}))"
            }
          ]
        }
      ]
    }
