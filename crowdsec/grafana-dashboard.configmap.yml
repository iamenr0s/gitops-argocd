apiVersion: v1
kind: ConfigMap
metadata:
  name: crowdsec-grafana-dashboard
  namespace: crowdsec
  labels:
    grafana_dashboard: "1"
data:
  crowdsec.json: |
    {
      "title": "CrowdSec",
      "uid": "crowdsec-overview",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Active Decisions",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(cs_active_decisions) by (origin, action)",
              "legendFormat": "{{origin}} / {{action}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "Alerts by Scenario",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_alerts[5m])) by (scenario)",
              "legendFormat": "{{scenario}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Parser Hits (OK vs KO)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_parsing_hits_ok[5m])) by (source)",
              "legendFormat": "ok / {{source}}",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_parsing_hits_ko[5m])) by (source)",
              "legendFormat": "ko / {{source}}",
              "refId": "B"
            }
          ]
        },
        {
          "id": 4,
          "title": "Bucket Overflows",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_bucket_overflowed[5m])) by (name)",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Dropped Events",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_dropped_events[5m])) by (source)",
              "legendFormat": "{{source}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "LAPI Request Rate by Route",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(cs_lapi_route_requests_total[5m])) by (route, method)",
              "legendFormat": "{{method}} {{route}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "title": "LAPI Request Duration (p95)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(cs_lapi_request_duration_seconds_bucket[5m])) by (le, route))",
              "legendFormat": "{{route}}",
              "refId": "A"
            }
          ]
        }
      ]
    }
