apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: domain-monitor-secrets
  namespace: domain-monitor
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: domain-monitor-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        app-encryption-key: "{{ .app_encryption_key }}"
        db-password: "{{ .db_password }}"
        .env: |
          APP_ENV=production
          APP_ENCRYPTION_KEY={{ .app_encryption_key }}
          DB_HOST=mariadb.mariadb.svc.cluster.local
          DB_PORT=3306
          DB_DATABASE=domain-monitor
          DB_USERNAME=domain-monitor
          DB_PASSWORD={{ .db_password }}
          SESSION_LIFETIME=1440
          SESSION_COOKIE_HTTPONLY=1
          SESSION_COOKIE_SECURE=1
          SESSION_COOKIE_SAMESITE=Strict
          TZ=UTC
  data:
    - secretKey: app_encryption_key
      remoteRef:
        key: domain-monitor/helm
        property: app_encryption_key
    - secretKey: db_password
      remoteRef:
        key: domain-monitor/helm
        property: db_password
