apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: certctl-ghcr-pull
  namespace: certctl
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: certctl-ghcr-pull
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"username":"{{ .ghcr_username }}","password":"{{ .ghcr_token }}","auth":"{{ printf "%s:%s" .ghcr_username .ghcr_token | b64enc }}"}}}'
  data:
    - secretKey: ghcr_username
      remoteRef:
        key: certctl/config
        property: ghcr_username
    - secretKey: ghcr_token
      remoteRef:
        key: certctl/config
        property: ghcr_token
