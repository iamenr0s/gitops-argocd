apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-hardening-image-signing
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/iamenr0s/k8s-hardening-cis.git
    targetRevision: master
    path: 12-image-signing-and-scanning
    kustomize: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    syncOptions:
      - CreateNamespace=false   # kyverno namespace already owned by the existing kyverno/ app
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
    # automated intentionally omitted -> Application starts/stays OutOfSync (ARGO-04)
