apiVersion: v1
kind: ConfigMap
metadata:
  name: dashy-config
  namespace: dashy
data:
  conf.yml: |
    pageInfo:
      title: Dashboard
    appConfig:
      theme: colorful
      statusCheck: true
    sections:
      - name: Platform
        items:
          - title: Traefik
            url: https://traefik.apps.k8s.example.com
            icon: hl-traefik
          - title: Prometheus
            url: https://prometheus.apps.k8s.example.com
            icon: hl-prometheus
          - title: Alertmanager
            url: https://alertmanager.apps.k8s.example.com
            icon: hl-prometheus
          - title: VoidAuth
            url: https://auth.apps.k8s.example.com
            icon: fas fa-key
      - name: Security
        items:
          - title: Trivy UI
            url: https://trivy-ui.apps.k8s.example.com
            icon: fas fa-shield-halved
          - title: Policy Reporter
            url: https://policy-reporter.apps.k8s.example.com
            icon: fas fa-clipboard-check
